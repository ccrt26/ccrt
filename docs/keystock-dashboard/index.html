<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重点股票产品化驾驶舱</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <h1>📊 驾驶舱</h1>
    <a data-view="dashboard" class="active" onclick="showView('dashboard')">🏠 驾驶舱</a>
    <a data-view="stocks" onclick="showView('stocks')">📋 股票列表</a>
    <a data-view="deep" onclick="showView('deep');renderDeepAnalysis()">📘 深度分析</a>
    <a data-view="daily" onclick="showView('daily');renderDailyAnalysis()">📅 每日分析</a>
    <a data-view="rules" onclick="showView('rules');renderRuleHealth()">⚖ 规则健康</a>
    <div class="version">Phase 2/3 v0.1</div>
  </nav>
  <main class="content">
    <div id="view-dashboard" class="view active"></div>
    <div id="view-stocks" class="view"></div>
    <div id="view-detail" class="view"></div>
    <div id="view-deep" class="view"></div>
    <div id="view-daily" class="view"></div>
    <div id="view-rules" class="view"></div>
  </main>
</div>
<script src="app.js"></script>
<script>init();</script>
</body>
</html>
