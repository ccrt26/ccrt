name: 模拟交易自动执行

on:
  workflow_dispatch:  # 仅允许手动触发，禁止定时自动模拟交易

permissions:
  contents: read  # 只读，禁止自动 commit/push

jobs:
  sim-trading-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Dry Run Sim Trading (no trades executed)
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "=== 模拟交易 dry-run: $DATE ==="
          python3 模拟交易/sim_orchestrator.py --date "$DATE" --root-dir "$GITHUB_WORKSPACE" --dry-run
          echo "=== Dry-run 完成（未执行实际交易） ==="
