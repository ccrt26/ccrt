name: CCRT GitHub Guard

on:
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CCRT GitHub Guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            python3 -m scripts.git_guard ready --base "$BASE_SHA" --json
          else
            git fetch origin master --depth=1
            python3 -m scripts.git_guard ready --base origin/master --json
          fi
