name: CCRT GitHub Guard

on:
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CCRT GitHub Guard
        shell: bash
        run: |
          set -euo pipefail
          # Use the exact PR base SHA for accurate diff comparison
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE_SHA" ]; then
            python3 -m scripts.git_guard ready --base "$BASE_SHA" --json
          else
            # workflow_dispatch — diff against remote base
            BASE_REF="${{ github.base_ref }}"
            BASE_REF="${BASE_REF:-master}"
            git fetch origin "$BASE_REF" --depth=1
            python3 -m scripts.git_guard ready --base "origin/$BASE_REF" --json
          fi
