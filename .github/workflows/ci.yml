name: IronLaw CI
on: [push, pull_request]
jobs:
  gate-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace Requirements
        run: python scripts/trace_requirements.py ${{ github.event.pull_request.title }}
      - name: Golden Master Diff (if applicable)
        run: |
          if git diff --name-only HEAD^ | grep -q "scoring_engine"; then
            python scripts/golden_master_diff.py
          fi
      - name: L2 Redline Check
        run: python scripts/check_redline_refs.py
      - name: File Size Gate
        run: python check_E.py $(git diff --name-only HEAD^)
