services:
  - type: web
    name: pigeon-dashboard
    env: python
    region: singapore
    rootDir: 代码文件/信鸽信息采集
    buildCommand: pip install -r requirements.txt
    startCommand: python pigeon_server.py
    plan: free
    envVars:
      - key: RENDER
        value: "1"
      - key: DATA_DIR
        value: /opt/render/project/data
      - key: AUTH_TOKEN
        sync: false
    disk:
      name: data
      mountPath: /opt/render/project/data
      sizeGB: 1
