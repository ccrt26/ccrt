<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数据健康报告</title>
<style>
body{font-family:'Microsoft YaHei',sans-serif;max-width:700px;margin:40px auto;padding:20px;color:#1a1a2e}
.badge{display:inline-block;padding:4px 16px;border-radius:12px;color:#fff;font-weight:bold}
.badge-L0{background:#27ae60}.badge-L1{background:#e67e22}.badge-L2{background:#e67e22}.badge-L3{background:#e74c3c}
h1{font-size:1.4em;margin:16px 0}
.section{border:1px solid #e0e0e0;border-radius:8px;padding:16px;margin:16px 0}
.section h2{font-size:1.1em;margin:0 0 12px 0}
.pass{color:#27ae60}.fail{color:#e74c3c}.warn{color:#e67e22}
table{width:100%;border-collapse:collapse;font-size:0.9em}
th,td{padding:6px 12px;text-align:left;border-bottom:1px solid #eee}
th{background:#f5f5f5}
.footer{margin-top:24px;font-size:0.8em;color:#999}
</style>
</head>
<body>
<h1>铁律量化 · 数据健康报告</h1>
<p>检测时间: {{CheckedAt}} | 模式: {{Mode}} | 状态: <span class="badge badge-{{AlertBadge}}">{{AlertLabel}}</span></p>

<div class="section">
<h2>检测消息</h2>
<ul>{{Messages}}</ul>
</div>

<div class="section">
<h2>T0 阻断字段</h2>
<p class="{{T0Class}}">{{T0Status}}</p>
</div>

<div class="section">
<h2>T1 降级字段</h2>
<p>{{T1Status}}</p>
</div>

<div class="section">
<h2>T2 可选字段</h2>
<p>{{T2Status}}</p>
</div>

<div class="section">
<h2>回填覆盖率</h2>
<p>{{BackfillCoverage}}%</p>
</div>

<div class="footer">
<p>铁律量化系统 · 自动生成 · {{GeneratedAt}}</p>
</div>
</body>
</html>
